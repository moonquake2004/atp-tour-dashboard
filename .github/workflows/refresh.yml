name: Refresh ATP data

# The ATP publishes new rankings on Mondays.  The weekly run refreshes the whole
# pipeline — rankings, the season calendar, the day-by-day results crawl, player
# profiles, draws and the rebuilt site — because a rankings-only refresh leaves the
# results feed frozen at the last time the crawl was run by hand.
#
# Manual runs can ask for the plain build.py defaults instead (which resume
# player records rather than refreshing them).

on:
  schedule:
    # Mondays at 09:23 UTC — after the ATP publishes its list.
    - cron: '23 9 * * 1'
  workflow_dispatch:
    inputs:
      deep:
        description: 'Also re-crawl player records, results and draws'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Weekly: full pipeline (calendar + results crawl + profile refresh + site).
      # A profile refresh is ~300 page fetches, which is why the timeout is 120 min.
      - name: Weekly refresh
        if: ${{ github.event_name == 'schedule' || !inputs.deep }}
        run: python3 pyscripts/refresh_rankings.py

      - name: Full refresh
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep }}
        run: python3 pyscripts/build.py

      - name: Commit updated snapshots
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data docs
          if git diff --staged --quiet; then
            echo "No data changes this week."
          else
            AS_OF=$(python3 -c "import json;print(json.load(open('data/rankings-singles.json'))['asOf'][:10])")
            git commit -m "data: ATP snapshot (${AS_OF})"
            git push
          fi
