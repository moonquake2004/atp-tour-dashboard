name: Refresh ATP data

# The ATP publishes new rankings on Mondays. This workflow pulls the current
# snapshot, rebuilds the derived aggregates and regenerates the static site.
#
# Manual runs can opt into a deeper refresh that also re-crawls results and draws.

on:
  schedule:
    # Mondays at 09:23 UTC — after the ATP publishes its list.
    - cron: '23 9 * * 1'
  workflow_dispatch:
    inputs:
      deep:
        description: 'Also re-crawl player records, results and draws'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh rankings, calendar and the site
        if: ${{ github.event_name == 'schedule' || !inputs.deep }}
        run: python3 pyscripts/refresh_rankings.py

      - name: Full refresh
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep }}
        run: python3 pyscripts/build.py

      - name: Commit updated snapshots
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data docs
          if git diff --staged --quiet; then
            echo "No data changes this week."
          else
            AS_OF=$(python3 -c "import json;print(json.load(open('data/rankings-singles.json'))['asOf'][:10])")
            git commit -m "data: ATP snapshot (${AS_OF})"
            git push
          fi
